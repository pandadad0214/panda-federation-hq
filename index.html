<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Panda Federation H.Q.</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="app"></div>
<header id="hud">
  <div class="title">🐼 Panda Federation H.Q.</div>
  <div id="feed" class="feed"><span class="dot"></span><span id="feedtext">connecting…</span></div>
  <div id="simlabel" hidden>Simulation</div>
</header>
<div id="warn" hidden></div>
<button id="fsbtn" type="button" title="Fullscreen (F)" aria-label="Enter fullscreen" hidden>
  <svg class="ex" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  <svg class="co" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
</button>
<aside id="panel">
  <section><h2>Team <span class="n">10</span></h2><ul id="team"></ul></section>
  <section id="actsec" hidden><h2 id="actlabel">Activity</h2><ul id="activity"></ul></section>
</aside>
<footer id="bar">
  <div id="legend"><span><i class="working"></i>Working</span><span><i class="waiting"></i>Needs you</span><span><i class="error"></i>Error</span><span><i class="done"></i>Done</span><span><i class="idle"></i>Idle</span></div>
  <div id="tod"><button data-m="now" type="button">Now</button><button data-m="day" type="button">Day</button><button data-m="evening" type="button">Evening</button><button data-m="night" type="button">Night</button></div>
  <button id="simbtn" type="button">Simulate Work</button>
  <a id="logout" href="/logout">Sign out</a>
</footer>
<script type="module" src="/src/main.js"></script>
</body>
</html>
