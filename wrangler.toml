name = "panda-federation-hq"
main = "worker/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "OFFICE"
class_name = "OfficeState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OfficeState"]

[triggers]
crons = ["*/5 * * * *"]

# Secrets (set with `wrangler secret put`, never in this file):
#   SITE_PASSWORD  - login password for the office
#   STATUS_TOKEN   - bearer token bots use to push status/usage
